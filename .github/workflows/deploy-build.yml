name: Deploy to BUILD

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Garde-fou : le déploiement ne s'exécute que si la sentinelle existe
      - name: Safety sentinel & container up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            ROOT="${{ secrets.SSH_PATH_ROOT }}"
            C="${{ secrets.DOCKER_PHP_CONTAINER }}"

            test -f "$ROOT/.allow-ci-sync" || (echo "No sentinel .allow-ci-sync, aborting"; exit 1)
            test -d "$ROOT" || (echo "Missing SSH_PATH_ROOT: $ROOT" && exit 1)

            docker ps --format '{{.Names}}' | grep -qx "$C" || (echo "PHP container not running: $C" && exit 1)

            echo "Safety check OK"
            echo "ROOT=$ROOT"
            echo "CONTAINER=$C"

      # Détecte ce qui a changé pour ne synchroniser que l'utile
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            theme:
              - 'themes/**'
            modules:
              - 'modules/**'
            override:
              - 'override/**'

      # RSYNC THEMES
      - name: Rsync themes/
        if: steps.filter.outputs.theme == 'true'
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --no-perms --no-owner --no-group --exclude '.git/' --exclude '*.bak' --exclude '*.bak.*' --exclude '*~' --exclude '.DS_Store'
          path: themes/
          remote_path: ${{ secrets.SSH_PATH_ROOT }}/themes/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      # RSYNC MODULES
      - name: Rsync modules/
        if: steps.filter.outputs.modules == 'true'
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --no-perms --no-owner --no-group --exclude '.git/' --exclude '*.bak' --exclude '*.bak.*' --exclude '*~' --exclude '.DS_Store'
          path: modules/
          remote_path: ${{ secrets.SSH_PATH_ROOT }}/modules/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      # RSYNC OVERRIDE
      - name: Rsync override/
        if: steps.filter.outputs.override == 'true'
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --no-perms --no-owner --no-group --exclude '.git/' --exclude '*.bak' --exclude '*.bak.*' --exclude '*~' --exclude '.DS_Store'
          path: override/
          remote_path: ${{ secrets.SSH_PATH_ROOT }}/override/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      # POST-DEPLOY DURABLE
      # Objectif :
      # - corriger les droits après rsync
      # - supprimer les caches incohérents
      # - régénérer le cache DEV avec www-data
      # - éviter définitivement les erreurs catalogue.fr-FR.*.php manquant
      - name: Post-deploy - Fix permissions and rebuild cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            ROOT="${{ secrets.SSH_PATH_ROOT }}"
            C="${{ secrets.DOCKER_PHP_CONTAINER }}"

            echo "== Post-deploy BUILD =="
            echo "ROOT=$ROOT"
            echo "CONTAINER=$C"

            test -d "$ROOT" || (echo "Missing ROOT: $ROOT" && exit 1)
            docker ps --format '{{.Names}}' | grep -qx "$C" || (echo "PHP container not running: $C" && exit 1)

            # Si l'utilisateur SSH n'est pas root, on utilise sudo.
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              SUDO="sudo -n"
            fi

            # IMPORTANT :
            # On récupère le UID/GID www-data depuis le conteneur PHP,
            # pas depuis le host, pour éviter les écarts host/container.
            WEB_UID="$(docker exec -u root "$C" sh -lc 'id -u www-data')"
            WEB_GID="$(docker exec -u root "$C" sh -lc 'id -g www-data')"

            echo "== Using WEB_UID=$WEB_UID WEB_GID=$WEB_GID =="

            echo "== 1. Fix runtime directories =="
            for d in var img download upload; do
              if [ -d "$ROOT/$d" ]; then
                echo "-- Fix $ROOT/$d"
                $SUDO chown -R "$WEB_UID:$WEB_GID" "$ROOT/$d"
                $SUDO find "$ROOT/$d" -type d -exec chmod 2775 {} \;
                $SUDO find "$ROOT/$d" -type f -exec chmod 664 {} \; 2>/dev/null || true
              fi
            done

            echo "== 2. Fix translations directories under modules/ and themes/ =="
            for base in "$ROOT/modules" "$ROOT/themes"; do
              if [ -d "$base" ]; then
                find "$base" -type d -name translations 2>/dev/null | while read tr; do
                  echo "-- Fix translations: $tr"
                  $SUDO chgrp -R "$WEB_GID" "$tr"
                  $SUDO chmod -R g+rwX "$tr"
                  $SUDO find "$tr" -type d -exec chmod 2775 {} \;
                  $SUDO find "$tr" -type f -exec chmod 664 {} \; 2>/dev/null || true
                done
              fi
            done

            echo "== 3. Fix writable module image/upload directories =="
            if [ -d "$ROOT/modules" ]; then
              find "$ROOT/modules" -type d \( \
                -name img -o \
                -name image -o \
                -name images -o \
                -name upload -o \
                -name uploads \
              \) 2>/dev/null | while read wd; do
                echo "-- Fix module writable dir: $wd"
                $SUDO chgrp -R "$WEB_GID" "$wd"
                $SUDO chmod -R g+rwX "$wd"
                $SUDO find "$wd" -type d -exec chmod 2775 {} \;
                $SUDO find "$wd" -type f -exec chmod 664 {} \; 2>/dev/null || true
              done
            fi

            echo "== 4. Hard reset Presta/Symfony cache inside container =="
            docker exec -u root "$C" sh -lc '
              set -e
              cd /var/www/html

              echo "-- Remove broken caches"
              rm -rf var/cache/dev var/cache/prod

              echo "-- Recreate cache/log directories"
              mkdir -p var/cache/dev var/cache/prod var/logs

              echo "-- Fix owner cache/logs"
              chown -R www-data:www-data var/cache var/logs

              echo "-- Fix permissions cache/logs"
              find var/cache var/logs -type d -exec chmod 2775 {} \;
              find var/cache var/logs -type f -exec chmod 664 {} \; 2>/dev/null || true

              echo "-- Write test as www-data"
              su -s /bin/sh www-data -c "touch var/cache/dev/.write_test && rm var/cache/dev/.write_test"

              echo "-- Cache warmup DEV as www-data"
              su -s /bin/sh www-data -c "php bin/console cache:warmup --env=dev"

              echo "-- Check generated translations cache"
              ls -lah var/cache/dev/translations 2>/dev/null || true

              echo "-- Final ownership check"
              stat -c "%U:%G %a %n" var/cache var/cache/dev var/cache/dev/translations 2>/dev/null || true
            '

            echo "== 5. Restart PHP container to clear OPCache/FPM state =="
            docker restart "$C"

            echo "== Post-deploy done =="

      # Healthcheck
      - name: Healthcheck
        run: |
          curl -fsSL -o /dev/null -w "%{http_code}\n" "${{ secrets.HEALTHCHECK_URL }}" | grep -E "200|301|302"