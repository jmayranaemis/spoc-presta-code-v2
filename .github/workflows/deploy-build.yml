name: Deploy to BUILD
on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Garde-fou : le déploiement ne s'exécute que si la sentinelle existe
      - name: Safety sentinel & container up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            test -f "${{ secrets.SSH_PATH_ROOT }}/.allow-ci-sync" || (echo "No sentinel .allow-ci-sync, aborting"; exit 1)
            test -d "${{ secrets.SSH_PATH_ROOT }}" || (echo "Missing SSH_PATH_ROOT" && exit 1)
            docker ps --format '{{.Names}}' | grep -q "${{ secrets.DOCKER_PHP_CONTAINER }}" || (echo "PHP container not running" && exit 1)

      # Détecte ce qui a changé pour ne synchroniser que l'utile
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            theme:
              - 'themes/**'
            modules:
              - 'modules/**'
            override:
              - 'override/**'

      # RSYNC THEMES (uniquement si des fichiers sous themes/** ont changé)
      - name: Rsync themes/
        if: steps.filter.outputs.theme == 'true'
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --no-perms --no-owner --no-group --exclude '.git/' --exclude '*.bak' --exclude '*.bak.*' --exclude '*~' --exclude '.DS_Store'
          path: themes/
          remote_path: ${{ secrets.SSH_PATH_ROOT }}/themes/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      # RSYNC MODULES
      - name: Rsync modules/
        if: steps.filter.outputs.modules == 'true'
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --no-perms --no-owner --no-group --exclude '.git/' --exclude '*.bak' --exclude '*.bak.*' --exclude '*~' --exclude '.DS_Store'
          path: modules/
          remote_path: ${{ secrets.SSH_PATH_ROOT }}/modules/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      # RSYNC OVERRIDE
      - name: Rsync override/
        if: steps.filter.outputs.override == 'true'
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --no-perms --no-owner --no-group --exclude '.git/' --exclude '*.bak' --exclude '*.bak.*' --exclude '*~' --exclude '.DS_Store'
          path: override/
          remote_path: ${{ secrets.SSH_PATH_ROOT }}/override/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      # POST-DEPLOY : Fix permissions runtime + translations (modules + themes)
      # But : éviter que rsync (qui crée des fichiers en user SSH) casse les écritures PHP (www-data)
      - name: Post-deploy - Fix permissions (runtime + translations)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            ROOT="${{ secrets.SSH_PATH_ROOT }}"

            # Si on n'est pas root, on essaie sudo (sinon ça échouera -> à ajuster côté serveur)
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              SUDO="sudo -n"
            fi

            # UID/GID www-data (fallback 33 si absent côté host)
            WEB_UID="$(getent passwd www-data | cut -d: -f3 2>/dev/null || echo 33)"
            WEB_GID="$(getent group  www-data | cut -d: -f3 2>/dev/null || echo 33)"

            echo "== Using ROOT=$ROOT / WEB_UID=$WEB_UID WEB_GID=$WEB_GID =="

            # 1) Runtime dirs (classiques Presta) -> owner/group www-data + group write
            for d in var img download upload; do
              [ -d "$ROOT/$d" ] || continue
              echo "== Fix runtime: $ROOT/$d =="
              $SUDO chown -R "$WEB_UID:$WEB_GID" "$ROOT/$d" || true
              $SUDO chmod -R g+rwX "$ROOT/$d" || true
              $SUDO find "$ROOT/$d" -type d -exec chmod 2775 {} \; 2>/dev/null || true
              $SUDO find "$ROOT/$d" -type f -exec chmod 664  {} \; 2>/dev/null || true
            done

            # 2) Tous les translations/ sous modules et themes
            #    -> on ne change PAS le owner (code), seulement group + perms
            echo "== Fix translations directories under modules/ and themes/ =="
            for base in "$ROOT/modules" "$ROOT/themes"; do
              [ -d "$base" ] || continue
              find "$base" -type d -name translations -print0 2>/dev/null | while IFS= read -r -d '' tr; do
                echo " - $tr"
                $SUDO chgrp -R "$WEB_GID" "$tr" || true
                $SUDO chmod -R g+rwX "$tr" || true
                $SUDO find "$tr" -type d -exec chmod 2775 {} \; 2>/dev/null || true
                $SUDO find "$tr" -type f -exec chmod 664  {} \; 2>/dev/null || true
              done
            done

            echo "== Post-deploy permissions done =="

      # Cache clear / warmup (sécurisé)
      - name: Clear & warmup cache inside container (www-data)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            C=${{ secrets.DOCKER_PHP_CONTAINER }}

            # (optionnel mais utile) s'assurer que var/ appartient à www-data
            docker exec -u root $C bash -lc "chown -R www-data:www-data var || true"

            # IMPORTANT: lancer symfony en www-data, pas en root
            docker exec -u www-data $C php bin/console cache:clear --env=dev --no-warmup || true
            docker exec -u www-data $C php bin/console cache:warmup --env=dev || true

      # Healthcheck
      - name: Healthcheck
        run: |
          curl -fsSL -o /dev/null -w "%{http_code}\n" "${{ secrets.HEALTHCHECK_URL }}" | grep -E "200|301|302"
